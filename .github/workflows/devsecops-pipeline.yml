name: DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sast-semgrep:
    name: "SAST - Semgrep Code Scanning"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Ejecutar análisis SAST con Semgrep
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            semgrep/semgrep \
            semgrep scan \
              --config p/security-audit \
              --config p/owasp-top-ten \
              --sarif --sarif-output=/src/semgrep-results.sarif \
              --json --json-output=/src/semgrep-results.json \
              /src || true
          ls -lh semgrep-results.*

      - name: Subir reporte SAST (SARIF y JSON) como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sast-report
          path: |
            semgrep-results.sarif
            semgrep-results.json