name: DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sast-semgrep:
    name: "SAST - Semgrep Code Scanning"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Ejecutar análisis SAST con Semgrep (SARIF)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            semgrep/semgrep \
            semgrep scan \
              --config p/security-audit \
              --config p/owasp-top-ten \
              --sarif --sarif-output=/src/semgrep-results.sarif \
              /src

      - name: Subir reporte SAST (SARIF) como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif-report
          path: semgrep-results.sarif

  sca-and-sbom:
    name: "SCA & Generación de SBOM"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Generar SBOM con Syft (CycloneDX JSON)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: "sbom.cyclonedx.json"

      - name: Subir artefacto SBOM (CycloneDX)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json

      - name: OWASP Dependency-Check Scan (Política Mitigada / Excepción Documentada)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'NodeGoat'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 11
            --enableExperimental

      - name: Subir Reporte SCA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/